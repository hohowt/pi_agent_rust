[package]
name = "pi-platform"
version = "0.1.16"
edition = "2024"
rust-version = "1.96"
license-file = "../../LICENSE"

[lib]
name = "pi_platform"
path = "src/lib.rs"
test = false
doctest = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
collapsible_if = "allow"
