[package]
name = "pi-observability"
version = "0.1.16"
edition = "2024"
rust-version = "1.85"
license-file = "../../LICENSE"

[lib]
name = "pi_observability"
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
proptest = "1.9.0"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
