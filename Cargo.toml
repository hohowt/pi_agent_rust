[package]
name = "pi_agent_rust"
version = "0.1.16"
edition = "2024"
rust-version = "1.85"
description = "High-performance AI coding agent CLI - Rust port of Pi Agent"
authors = ["Jeffrey Emanuel"]
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/pi_agent_rust"
homepage = "https://github.com/Dicklesworthstone/pi_agent_rust"
documentation = "https://docs.rs/pi_agent_rust"
readme = "README.md"
keywords = ["ai", "cli", "coding-agent", "llm", "anthropic"]
categories = ["command-line-utilities", "development-tools"]
autobins = false
autoexamples = false
autobenches = false
autotests = false

# Binary organization per bd-uuwgi.1/bd-uuwgi.2 classification:
# - SHIPPING: src/main.rs (pi) - main CLI binary
# - RETIRABLE: src/bin/pi_legacy_capture.rs (pending RULE 1 approval)
# - DEV-ONLY: moved to examples/ (21 files: ext_*, test_*, debug utilities)
include = [
    "docs/provider-legacy-models.json",
    "docs/provider-upstream-model-ids-snapshot.json",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    # Pulled in by `include_str!("../../CHANGELOG.md")` in
    # src/interactive/commands.rs and src/interactive.rs — without it the
    # `cargo publish --dry-run` verify step fails to build the packaged tarball.
    "CHANGELOG.md",
    "src/**",
]

[lib]
name = "pi"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "pi"
path = "src/main.rs"
test = false

[[test]]
name = "auth_storage_async"
path = "tests/auth_storage_async.rs"

[[test]]
name = "package_manager_async"
path = "tests/package_manager_async.rs"

[[test]]
name = "agent_cx_tokio"
path = "tests/agent_cx_tokio.rs"

[[test]]
name = "root_tokio_runtime"
path = "tests/root_tokio_runtime.rs"

[[test]]
name = "semantic_workspace_graph_tree_sitter"
path = "tests/semantic_workspace_graph_tree_sitter.rs"

[dependencies]
pi-core = { workspace = true }
pi-codegraph = { workspace = true }
pi-http = { workspace = true }
pi-observability = { workspace = true }
pi-platform = { workspace = true }
pi-prompt = { workspace = true }
pi-runtime = { workspace = true }
pi-theme = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive", "env", "string"] }

# Async runtime
futures = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"] }

# URL parsing/building
url = { workspace = true }

# Signals
ctrlc = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["raw_value"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Terminal output (rich_rust for beautiful TUI)
rich_rust = { workspace = true, features = ["markdown"] }
crossterm = { workspace = true }

# Interactive TUI (charmed_rust - bubbletea/lipgloss/bubbles/glamour)
bubbletea = { workspace = true }
lipgloss = { workspace = true }
bubbles = { workspace = true }
glamour = { workspace = true }
unicode-width = { workspace = true }
arboard = { workspace = true, optional = true }

# Filesystem
dirs = { workspace = true }
tempfile = { workspace = true }
fs4 = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
rusqlite = { workspace = true }
notify = { workspace = true }

# Time
chrono = { workspace = true, features = ["serde"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Utilities
uuid = { workspace = true, features = ["v4"] }
memchr = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
crc32c = { workspace = true }
unicode-normalization = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh32"] }
similar = { workspace = true }
sysinfo = { workspace = true }

# Image processing (optional)
image = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = { workspace = true }

[features]
default = ["sqlite-sessions"]
full = [
    "image-resize",
    "clipboard",
    "sqlite-sessions",
    "syntax-highlighting",
    "rich_rust/full",
]
image-resize = ["image"]
clipboard = ["dep:arboard"]
sqlite-sessions = []
syntax-highlighting = ["rich_rust/syntax"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 12
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow some common patterns
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# ---------------------------------------------------------------------------
# Local development with sibling crates
# ---------------------------------------------------------------------------
# This project depends on published crates.io versions of rich_rust and
# charmed-*. CI builds verify this (no sibling repos are checked out).
#
# To develop against LOCAL checkouts of these crates, uncomment the
# [patch.crates-io] section below. Cargo will use the local paths when they
# satisfy the version requirement and fall back to crates.io otherwise.
#
# IMPORTANT: Do NOT commit this section. To prevent accidental commits:
#   git update-index --skip-worktree Cargo.toml
# To re-enable tracking:
#   git update-index --no-skip-worktree Cargo.toml
#
# [patch.crates-io]
# rich_rust = { path = "../rich_rust" }
# charmed-bubbletea = { path = "../charmed_rust/crates/bubbletea" }
# charmed-bubbletea-macros = { path = "../charmed_rust/crates/bubbletea-macros" }
# charmed-lipgloss = { path = "../charmed_rust/crates/lipgloss" }
# charmed-bubbles = { path = "../charmed_rust/crates/bubbles" }
# charmed-glamour = { path = "../charmed_rust/crates/glamour" }
# charmed-harmonica = { path = "../charmed_rust/crates/harmonica" }

[workspace]
members = [
    ".",
    "crates/pi-core",
    "crates/pi-codegraph",
    "crates/pi-http",
    "crates/pi-observability",
    "crates/pi-platform",
    "crates/pi-prompt",
    "crates/pi-runtime",
    "crates/pi-theme",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
async-trait = "0.1"
base64 = "0.22"
bubbles = { package = "charmed-bubbles", version = "0.2.0" }
bubbletea = { package = "charmed-bubbletea", version = "0.2.0" }
chrono = "0.4"
clap = "4.5.60"
crc32c = "0.6"
crossterm = "0.29"
ctrlc = "3.5.2"
dirs = "6"
enable-ansi-support = "0.2"
fs4 = "0.13"
futures = "0.3"
glamour = { package = "charmed-glamour", version = "0.2.0" }
glob = "0.3"
ignore = "0.4"
image = "0.25"
lipgloss = { package = "charmed-lipgloss", version = "0.2.0" }
memchr = "2.8.0"
pi-core = { path = "crates/pi-core" }
pi-codegraph = { path = "crates/pi-codegraph" }
pi-http = { path = "crates/pi-http" }
pi-observability = { path = "crates/pi-observability" }
pi-platform = { path = "crates/pi-platform" }
pi-prompt = { path = "crates/pi-prompt" }
pi-runtime = { path = "crates/pi-runtime" }
pi-theme = { path = "crates/pi-theme" }
proptest = "1.9.0"
regex = "1.12.3"
reqwest = { version = "0.12", default-features = false }
rich_rust = "0.2.0"
rusqlite = "0.37"
notify = "8.2.0"
serde = "1"
serde_json = "1"
sha2 = "0.10"
similar = "2"
sysinfo = "0.38.2"
tempfile = "3.25.0"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tree-sitter = "0.26.9"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.2"
unicode-normalization = "0.1"
unicode-width = "0.2"
url = "2"
uuid = "1.21.0"
xxhash-rust = "0.8"
